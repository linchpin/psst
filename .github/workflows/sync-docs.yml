name: Sync docs to WordPress

# Publishes docs/ to docs.linchpin.com via DocsPress. Mirrors discovery, mantle
# and linchpin-blocks.
#
# Intentionally inert until promoted: manual trigger only, dry-run by default,
# drafts by default, removals go to Trash. Promote in this order, checking the
# Actions summary each time: run as-is; set dry-run false; set status publish;
# only then add the push trigger commented out at the bottom.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Plan only, write nothing"
        type: boolean
        default: true
      status:
        description: "Status for created or updated pages"
        type: choice
        options:
          - draft
          - publish
        default: draft

permissions:
  contents: read

concurrency:
  group: docspress-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7, pinned to a SHA because this job holds a WordPress token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: linchpin/docspress@v1
        with:
          mode: publish
          wordpress-url: https://docs.linchpin.com
          wordpress-site: docs.linchpin.com
          wordpress-access-token: ${{ secrets.WP_ACCESS_TOKEN }}
          docs-dir: docs
          # Shared with the other plugin documentation repositories; root-slug,
          # root-title, status and create-h1 must match theirs exactly.
          root-slug: wordpress-plugins
          root-title: WordPress Plugins
          managed-path: wordpress-plugins/psst
          create-h1: false
          rewrite-links: true
          status: ${{ inputs.status || 'draft' }}
          delete-mode: trash
          dry-run: ${{ inputs.dry-run == false && 'false' || 'true' }}

