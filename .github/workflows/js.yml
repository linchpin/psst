name: JavaScript

on:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'blocks/src/**'
            - 'package.json'
            - 'package-lock.json'
            - 'blocks/package.json'
            - 'blocks/package-lock.json'
            - 'webpack.config.js'
            - 'blocks/webpack.config.js'
            - '.nvmrc'
            - '.github/workflows/js.yml'
    pull_request:
        paths:
            - 'src/**'
            - 'blocks/src/**'
            - 'package.json'
            - 'package-lock.json'
            - 'blocks/package.json'
            - 'blocks/package-lock.json'
            - 'webpack.config.js'
            - 'blocks/webpack.config.js'
            - '.nvmrc'
            - '.github/workflows/js.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    js:
        name: JavaScript checks
        runs-on: ubuntu-latest
        timeout-minutes: 15

        # Only release-please is excluded. Renovate automerges npm minors and
        # patches, so for those branches this workflow is the only gate.
        if: >-
            !startsWith(github.head_ref || github.ref_name, 'release-please--')

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            # Two projects, two lockfiles.
            - name: Install dependencies
              run: npm run install:ci

            # `!cancelled()` throughout, so a lint failure still lets the build
            # and the unit tests report.
            - name: Lint JavaScript
              if: ${{ !cancelled() }}
              run: npm run lint:js && npm run lint:js --prefix blocks

            - name: Lint styles
              if: ${{ !cancelled() }}
              run: npm run lint:css && npm run lint:css --prefix blocks

            # The crypto module is the one piece of this plugin a reviewer cannot
            # eyeball for correctness; the vectors are the proof.
            - name: Unit tests
              if: ${{ !cancelled() }}
              run: npm run test:unit

            # The build is the real check. Blocks register from their *built*
            # block.json and build/ is gitignored, so a build that does not run is
            # a plugin whose blocks never register, silently.
            - name: Build
              if: ${{ !cancelled() }}
              run: npm run build:all

    e2e:
        name: End to end (Playground)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        if: >-
            !startsWith(github.head_ref || github.ref_name, 'release-please--')
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  tools: composer:v2

            - name: Install Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: |
                  composer install --no-dev --no-interaction --optimize-autoloader
                  npm run install:ci

            - name: Build
              run: npm run build:all

            - name: Install Playwright
              run: npm run playwright:install

            - name: Run the end-to-end suite
              run: npm run test:e2e
              env:
                  CI: true

            - name: Upload the report
              if: ${{ failure() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7
