name: Update asset/readme on WordPress.org

# Pushes readme.txt and the listing assets in .wordpress-org/ to the
# WordPress.org SVN repository between releases, so a copy fix, a new
# screenshot or a "Tested up to" bump reaches the listing without cutting a
# version. Mirrors post-type-spotlight.
#
# The action updates trunk/readme.txt and the assets directory only. It does
# not touch tags, so the Stable tag continues to point at the released
# version whatever this run changes.

on:
    push:
        branches:
            - main
        paths:
            - 'readme.txt'
            - '.wordpress-org/**'
            - '.github/workflows/wordpress-plugin-asset-update.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: wporg-assets
    cancel-in-progress: false

jobs:
    assets:
        name: Update readme and assets
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # The action reads readme.txt from the checkout, not from a build,
            # so the release-please markers have to go here. Left in, they
            # render as literal text in the header block and hide the Stable
            # tag from the WordPress.org readme parser.
            #
            # Inline for now: linchpin/actions gained a strip-release-markers
            # composite action on 2026-09-15, but it is not yet in a v4 release.
            # Swap to linchpin/actions/actions/strip-release-markers@v4 once it
            # is.
            - name: Strip the release-please markers from readme.txt
              run: |
                  sed -i '/x-release-please-start-version/d;/x-release-please-end/d' ./readme.txt
                  echo "Removed release-please marker lines from readme.txt"

            - name: Update the WordPress.org listing
              uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # v2.2.0
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SLUG: psst
                  ASSETS_DIR: .wordpress-org
