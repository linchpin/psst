name: WordPress Plugin Check

on:
    # Not on the pull-request path. Psst is published to packagist.linchpin.com
    # and installed by Composer, so the check is advisory rather than a
    # submission gate. `workflow_call` lets the release path gate on it and
    # `workflow_dispatch` runs it against a branch on demand.
    workflow_call:
    workflow_dispatch:

# No `concurrency` block: invoked through workflow_call, `github.workflow`
# resolves to the caller's name and a group here can deadlock with the caller's.

permissions:
    contents: read

jobs:
    plugin-check:
        name: Plugin Check
        uses: linchpin/actions/.github/workflows/plugin-check.yml@v4
        secrets: inherit
        with:
            build_dir: ./build/psst
            build_command: bash scripts/build.sh
            php_version: '8.3'
            exclude_directories: vendor,node_modules
            # "Psst" is four letters and the WordPress.org slug generator wants
            # five, so the plugin_repo category reports the name as unsupported.
            # The name stays and the plugin is hand-submitted with a request for
            # the `psst` slug. Ignored by code, not by check name: the rest of the
            # header checks still run. A code, so it belongs in ignore_codes.
            ignore_codes: plugin_header_unsupported_plugin_name
